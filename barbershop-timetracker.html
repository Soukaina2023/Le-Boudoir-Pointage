              data.auditLog.map((entry, i) => (
                <div key={i} className="audit-item">
                  <div className="audit-time">{new Date(entry.ts).toLocaleDateString(lang==='ar'?'ar-MA':'fr-FR')} {new Date(entry.ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</div>

              ))

        </div>
      </div>
    </div>
  );
};

const App = () => {
  const [data, setData] = useState(initData);
  const [currentWorker, setCurrentWorker] = useState(null);
  const [activePage, setActivePage] = useState('dashboard');
  const [lang, setLangState] = useState(data.settings?.language || 'fr');
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const { toasts, toast } = useToast();

  const t = translations[lang];

  const setLang = (l) => {
    setLangState(l);
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  };

  useEffect(() => {
    setLang(lang);
  }, [lang]);

  // Check forgot checkout
  useEffect(() => {
    if (!currentWorker) return;
    const session = data.activeSessions[currentWorker.id] || {};
    if (session.status === 'working' && session.date !== todayKey()) {
      toast(t.forgotCheckout, 'warning');
    }
  }, [currentWorker]);

  const handleLogout = () => {
    setCurrentWorker(null);
    setActivePage('dashboard');
  };

  const navItems = [
    { id:'dashboard', icon:'📊', label:t.dashboard },
    { id:'timeTracking', icon:'⏱', label:t.timeTracking },
    { id:'history', icon:'📋', label:t.history },
    { id:'reports', icon:'📈', label:t.reports },
    ...(currentWorker?.isAdmin ? [{ id:'workers', icon:'👥', label:t.workers }] : []),
    { id:'settings', icon:'⚙️', label:t.settings },
  ];

  if (!currentWorker) {
    return (
      <>
        <LoginScreen
          workers={data.workers}
          settings={data.settings}
          onLogin={setCurrentWorker}
          lang={lang}
          setLang={setLang}
          t={t}
        />
        <ToastContainer toasts={toasts} />
      </>
    );
  }

  const renderPage = () => {
    const props = { data, setData, currentWorker, t, lang, toast };
    switch(activePage) {
      case 'dashboard': return <DashboardPage {...props} />;
      case 'timeTracking': return <TimeTrackingPage {...props} />;
      case 'history': return <RecordsPage {...props} />;
      case 'reports': return <ReportsPage {...props} />;
      case 'workers': return currentWorker.isAdmin ? <WorkersPage {...props} /> : <DashboardPage {...props} />;
      case 'settings': return <SettingsPage {...props} setLang={setLang} />;
      default: return <DashboardPage {...props} />;
    }
  };

  return (
    <div className="app-container">
      {/* Mobile header */}
      <div className="mobile-header" style={{ background:'var(--dark-2)', borderBottom:'1px solid var(--border)', position:'sticky', top:0, zIndex:50, display:'none' }}>
        <div className="flex items-center gap-2">
          <span style={{fontSize:20}}>✂️</span>
          <span style={{fontWeight:800, color:'var(--gold)', fontSize:16}}>{t.appName}</span>
        </div>
        <button className="btn btn-ghost btn-sm btn-icon" onClick={() => setSidebarOpen(!sidebarOpen)}>☰</button>
      </div>

      {/* Sidebar overlay for mobile */}
      {sidebarOpen && (
        <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.5)', zIndex:99 }} onClick={() => setSidebarOpen(false)} />
      )}

      {/* Sidebar */}
      <div className={`sidebar ${sidebarOpen ? 'open' : ''}`}>
        <div className="sidebar-logo">
          <div className="logo-mark">✂️</div>
          <div className="logo-text">{t.appName}</div>
          <div className="logo-sub">{t.appSub}</div>
        </div>

        <div className="sidebar-nav">
          <div className="nav-section">
            {navItems.map(item => (
              <div
                key={item.id}
                className={`nav-item ${activePage === item.id ? 'active' : ''}`}
                onClick={() => { setActivePage(item.id); setSidebarOpen(false); }}
              >
                <span className="nav-icon">{item.icon}</span>
                {item.label}
              </div>
            ))}
          </div>

          {/* Lang switcher in sidebar */}
          <div className="nav-section">
            <div className="nav-section-title">{t.language}</div>
            <div className="flex gap-2" style={{ paddingRight:8 }}>
              <button className={`mode-chip ${lang==='fr'?'active':''}`} onClick={() => setLang('fr')} style={{flex:1,textAlign:'center'}}>🇫🇷 FR</button>
              <button className={`mode-chip ${lang==='ar'?'active':''}`} onClick={() => setLang('ar')} style={{flex:1,textAlign:'center'}}>🇲🇦 AR</button>
            </div>
          </div>
        </div>

        <div className="sidebar-footer">
          <div className="worker-chip">
            <div className="worker-avatar" style={{ background:`linear-gradient(135deg, ${currentWorker.color}, ${currentWorker.color}88)` }}>
              {(lang==='ar' ? currentWorker.name : (currentWorker.nameFr||currentWorker.name)).charAt(0)}
            </div>
            <div style={{flex:1}}>
              <div className="worker-name">{lang==='ar' ? currentWorker.name : (currentWorker.nameFr||currentWorker.name)}</div>
              <div className="worker-role">{lang==='ar' ? currentWorker.role : (currentWorker.roleFr||currentWorker.role)}</div>
            </div>
            <button className="btn btn-ghost btn-sm btn-icon" onClick={handleLogout} title={t.logout} style={{padding:6}}>↩</button>
          </div>
        </div>
      </div>

      {/* Main */}
      <div className="main-content">
        {renderPage()}
      </div>

      <ToastContainer toasts={toasts} />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<!-- Mobile sidebar toggle via CSS media query -->
<style>
@media (max-width: 768px) {
  .mobile-header { display: flex !important; }
  .main-content { margin-right: 0 !important; margin-left: 0 !important; padding-top: 0 !important; }
}
</style>
</body>
</html>
